name: EldritchBattles
version: '0.2.5'
main: dev.eldritch.battles.EldritchBattles
api-version: '1.21.11'
author: Eldritch Champions
description: Experimental standalone PvP duels, parties, kits, reports and resettable arenas.
commands:
  eb:
    description: Main Eldritch Battles command
    usage: /eb help
    aliases: [eldritchbattle]
  duel:
    description: Challenge another player to a direct 1v1 duel
    usage: /duel <player> (or /eb duel <player>)
  party:
    description: Manage Eldritch parties
    usage: /party create|invite|join|open|close|broadcast|kick|promote|leave (or /eb party ...)
permissions:
  eldritch.admin:
    default: op
    description: Create, edit, recover and save arenas and kits.
